name: Refresh open-source record

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rebuild data/oss.json from GitHub
        run: node scripts/fetch-oss.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit when the record changed
        run: |
          # generatedAt changes on every run; only commit when the content did.
          git show HEAD:data/oss.json | jq -S 'del(.generatedAt)' > "$RUNNER_TEMP/before.json"
          jq -S 'del(.generatedAt)' data/oss.json > "$RUNNER_TEMP/after.json"
          if cmp -s "$RUNNER_TEMP/before.json" "$RUNNER_TEMP/after.json"; then
            echo "No change in the open-source record."
            git checkout -- data/oss.json
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/oss.json
          git commit -m "Refresh open-source record"
          git push
