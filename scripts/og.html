<!doctype html>
<!--
  Template for assets/og.png (1200x630). Not linked from the site.
  Regenerate with the site served on port 4173:
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
      --window-size=1200,630 --virtual-time-budget=6000 --screenshot=assets/og.png \
      http://localhost:4173/scripts/og.html
-->
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <title>Social preview</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    body { width: 1200px; height: 630px; overflow: hidden; display: grid; grid-template-columns: 1fr 340px; align-items: end; gap: 40px; padding: 64px; }
    .name { font-size: 9.25rem; }
    .card-lead { margin-top: 36px; font-size: 1.625rem; line-height: 1.35; color: var(--muted); max-width: 32rem; }
    .card-pet { width: 340px; height: auto; }
  </style>
</head>
<body>
  <div>
    <h1 class="name"><span class="name-line">Gaurav</span><span class="name-line">Jadhav</span></h1>
    <p class="card-lead">Full stack AI engineer. AI products, agents and web apps.</p>
  </div>
  <img class="card-pet" src="../assets/pet/hello.webp" width="260" height="300" alt="">
</body>
</html>
